<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<p>Open browser console and run generateIcons() to generate PNG icons.</p>
<canvas id="c"></canvas>
<div id="links"></div>
<script>
function drawIcon(size) {
  const canvas = document.getElementById('c');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const cx = size / 2, cy = size / 2, r = size * 0.45;

  ctx.fillStyle = '#000000';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size * 0.18);
  ctx.fill();

  // Outer ring
  ctx.strokeStyle = '#C9A84C';
  ctx.lineWidth = size * 0.03;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  // Center dot
  ctx.fillStyle = '#C9A84C';
  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.08, 0, Math.PI * 2);
  ctx.fill();

  // Orbital ring (ellipse rotated -30deg)
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-Math.PI / 6);
  ctx.scale(1, 0.35);
  ctx.strokeStyle = '#C9A84C';
  ctx.lineWidth = size * 0.025;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.6, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  return canvas.toDataURL('image/png');
}

function generateIcons() {
  const sizes = [72, 96, 128, 192, 256, 512];
  const links = document.getElementById('links');
  links.innerHTML = '<h3>Right-click each link and Save As:</h3>';
  sizes.forEach(s => {
    const dataUrl = drawIcon(s);
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `icon-${s}.png`;
    a.textContent = `Download icon-${s}.png`;
    a.style = 'display:block; margin:8px 0; color:#C9A84C;';
    links.appendChild(a);
  });
}

generateIcons();
</script>
</body>
</html>
